name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Whisperwaltz ${{ github.ref_name }}
          files: build/libs/whisperwaltz-*.jar
          body: |
            ## Whisperwaltz ${{ github.ref_name }}

            **Minecraft:** 1.21.1 | **Loader:** NeoForge 21.1.172

            ### Features
            - **Whisperwaltz sword** — 12 attack damage
            - Animated item name with a seamless light-blue → white gradient ripple

            ### Installation
            1. Install [NeoForge 21.1.172](https://neoforged.net/) for Minecraft 1.21.1
            2. Drop `whisperwaltz-${{ github.ref_name }}.jar` into your `mods/` folder
            3. Launch the game and craft or `/give` yourself `whisperwaltz:whisperwaltz_sword`
